<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todoapp">
    <header class="header">
      <h1>Tareas</h1>
      <div class="list-bar">
        <select id="list-select" class="list-select"
                aria-label="Lista activa"></select>
        <button id="add-list" class="list-action" title="Nueva lista"
                aria-label="Nueva lista">+</button>
        <button id="rename-list" class="list-action"
                title="Renombrar lista" aria-label="Renombrar lista">✎</button>
        <button id="archive-list" class="list-action"
                title="Archivar lista" aria-label="Archivar lista">↓</button>
        <button id="delete-list" class="list-action"
                title="Eliminar lista" aria-label="Eliminar lista">×</button>
      </div>
      <input id="new-todo" class="new-todo" type="text"
             placeholder="¿Qué hay que hacer?" autofocus>
    </header>

    <section class="main">
      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <details id="archived-section" class="archived" hidden>
      <summary>Archivadas</summary>
      <ul id="archived-list" class="archived-list"></ul>
    </details>

    <footer class="footer">
      <span id="todo-count" class="todo-count">0 pendientes</span>
      <ul class="filters">
        <li><a href="#/" id="filter-all">Todas</a></li>
        <li><a href="#/active" id="filter-active">Pendientes</a></li>
        <li><a href="#/completed" id="filter-completed">Completadas</a></li>
      </ul>
      <button id="clear-completed" class="clear-completed">
        Limpiar completadas
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
