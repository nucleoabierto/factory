<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todoapp">
    <header class="header">
      <h1>Tareas</h1>
      <div class="list-bar">
        <select id="list-select" class="list-select"
                aria-label="Lista activa"
                data-action="set-active-list"></select>
        <button id="add-list" class="list-action" title="Nueva lista"
                aria-label="Nueva lista" data-action="add-list">+</button>
        <button id="rename-list" class="list-action"
                title="Renombrar lista" aria-label="Renombrar lista"
                data-action="rename-list">Renombrar</button>
        <button id="archive-list" class="list-action"
                title="Archivar lista" aria-label="Archivar lista"
                data-action="archive-list">Archivar</button>
        <button id="delete-list" class="list-action"
                title="Eliminar lista" aria-label="Eliminar lista"
                data-action="delete-list">Eliminar</button>
      </div>
      <input id="new-todo" class="new-todo" type="text"
             placeholder="¿Qué hay que hacer?" autofocus
             data-action="add-task">
    </header>

    <section class="main">
      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <details id="archived-section" class="archived" hidden>
      <summary>Archivadas</summary>
      <ul id="archived-list" class="archived-list"></ul>
    </details>

    <footer class="footer">
      <div class="views-row">
      <ul class="views">
        <li><a href="#/main" id="view-main" data-action="set-view"
               data-view="main">Lista</a></li>
        <li><a href="#/today" id="view-today" data-action="set-view"
               data-view="today">Hoy</a></li>
      </ul>
      </div>
      <div class="filters-row">
      <ul class="filters">
        <li><a href="#/" id="filter-all" data-action="set-filter"
               data-filter="all">Todas</a></li>
        <li><a href="#/active" id="filter-active" data-action="set-filter"
               data-filter="active">Pendientes</a></li>
        <li><a href="#/completed" id="filter-completed"
               data-action="set-filter"
               data-filter="completed">Completadas</a></li>
      </ul>
      </div>
      <div class="export-row">
        <button id="export-file" class="export-action"
                title="Descargar el estado como archivo"
                data-action="export-file">Exportar</button>
        <button id="export-link" class="export-action"
                title="Obtener un enlace con el contenido"
                data-action="export-link">Enlace</button>
      </div>
      <div class="footer-row">
        <span id="todo-count" class="todo-count">0 pendientes</span>
        <button id="clear-completed" class="clear-completed"
                data-action="clear-completed">
          Limpiar completadas
        </button>
      </div>
    </footer>
  </main>

  <script src="todo-core.js"></script>
  <script src="todo-domain.js"></script>
  <script src="todo-storage.js"></script>
  <script src="todo-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
