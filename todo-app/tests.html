<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tests — Lista de tareas</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/qunit@2.24.1/qunit/qunit.css">
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <script src="https://cdn.jsdelivr.net/npm/qunit@2.24.1/qunit/qunit.js"></script>
  <script src="app.js"></script>
  <script>
    QUnit.module('harness', () => {
      QUnit.test('the App logic object exists and exposes init', (assert) => {
        assert.ok(window.App, 'App is defined');
        assert.strictEqual(typeof window.App.init, 'function',
          'App.init is a function');
      });
    });

    QUnit.module('create and list', (hooks) => {
      hooks.beforeEach(() => {
        localStorage.removeItem('todoapp-tasks');
        localStorage.removeItem('todoapp-filter');
        window.App.reset();
        window.App.initialized = false;
        window.App.editingId = null;
        window.App.filter = 'all';
        const fixture = document.getElementById('qunit-fixture');
        fixture.innerHTML =
          `<input id="new-todo" type="text">
          <ul id="todo-list"></ul>
          <span id="todo-count"></span>`;
      });

      QUnit.test('creating a task adds it to the state and the list',
        (assert) => {
          const task = window.App.addTask('Comprar pan');
          assert.ok(task, 'returns the created task');
          assert.strictEqual(window.App.tasks.length, 1,
            'the state holds one task');
          assert.strictEqual(window.App.tasks[0].text, 'Comprar pan');
          assert.false(window.App.tasks[0].done,
            'it starts as pending');
          const items = document.querySelectorAll('#todo-list li');
          assert.strictEqual(items.length, 1, 'the list shows one item');
          assert.strictEqual(
            items[0].querySelector('label').textContent, 'Comprar pan');
        });

      QUnit.test('empty or whitespace-only texts create no task',
        (assert) => {
          assert.strictEqual(window.App.addTask(''), null);
          assert.strictEqual(window.App.addTask('   '), null);
          assert.strictEqual(window.App.tasks.length, 0,
            'the state stays empty');
          assert.strictEqual(
            document.querySelectorAll('#todo-list li').length, 0,
            'the list stays empty');
        });

      QUnit.test('the counter reflects pending tasks after several adds',
        (assert) => {
          window.App.addTask('Una');
          window.App.addTask('Dos');
          window.App.addTask('Tres');
          assert.strictEqual(window.App.pendingCount(), 3);
          assert.strictEqual(
            document.getElementById('todo-count').textContent,
            '3 pendientes');
        });

      QUnit.test('adding persists and load restores the state',
        (assert) => {
          window.App.addTask('Persistirme');
          const raw = localStorage.getItem('todoapp-tasks');
          assert.ok(raw, 'the key exists in localStorage');
          window.App.reset();
          window.App.load();
          assert.strictEqual(window.App.tasks.length, 1);
          assert.strictEqual(window.App.tasks[0].text, 'Persistirme');
        });

      QUnit.test('load tolerates missing key or corrupted data',
        (assert) => {
          window.App.load();
          assert.deepEqual(window.App.tasks, [],
            'missing key yields an empty list');
          window.App.addTask('x');
          localStorage.setItem('todoapp-tasks', '{broken json');
          window.App.load();
          assert.deepEqual(window.App.tasks, [],
            'broken JSON yields an empty list');
        });

      QUnit.test('load keeps only items with a valid task shape',
        (assert) => {
          localStorage.setItem('todoapp-tasks', JSON.stringify([
            { id: 3, text: 'Válida', done: true },
            { id: 'x', text: 'sin id numérico', done: false },
            { id: 4, text: '', done: false },
            { id: 5, text: 'sin done' },
            null,
            { id: 7, text: 'Otra válida', done: false }
          ]));
          window.App.load();
          assert.strictEqual(window.App.tasks.length, 2,
            'only valid items enter the state');
          assert.deepEqual(
            window.App.tasks.map((t) => t.id),
            [3, 7], 'the valid tasks keep their ids');
          assert.strictEqual(window.App.nextId, 8,
            'nextId stays above the highest valid id');
        });

      QUnit.test('Enter in the input creates the task and clears it',
        (assert) => {
          window.App.init();
          const input = document.getElementById('new-todo');
          input.value = 'Desde el teclado';
          input.dispatchEvent(new KeyboardEvent('keydown',
            { key: 'Enter' }));
          assert.strictEqual(window.App.tasks.length, 1);
          assert.strictEqual(input.value, '',
            'the field is cleared after creating');
        });
    });

    QUnit.module('complete, edit and delete', (hooks) => {
      hooks.beforeEach(() => {
        localStorage.removeItem('todoapp-tasks');
        localStorage.removeItem('todoapp-filter');
        window.App.reset();
        window.App.initialized = false;
        window.App.editingId = null;
        window.App.filter = 'all';
        const fixture = document.getElementById('qunit-fixture');
        fixture.innerHTML =
          `<input id="new-todo" type="text">
          <ul id="todo-list"></ul>
          <span id="todo-count"></span>`;
      });

      QUnit.test('toggling a task marks it done and lowers the counter',
        (assert) => {
          const task = window.App.addTask('Toggle me');
          window.App.toggleTask(task.id);
          assert.true(window.App.tasks[0].done, 'state marks it done');
          const li = document.querySelector('#todo-list li');
          assert.strictEqual(li.className, 'done',
            'the item carries the done class');
          assert.strictEqual(
            document.getElementById('todo-count').textContent,
            '0 pendientes', 'the counter drops to zero');
          window.App.toggleTask(task.id);
          assert.false(window.App.tasks[0].done, 'untoggling reverts');
          assert.strictEqual(
            document.getElementById('todo-count').textContent,
            '1 pendiente');
        });

      QUnit.test('editing a task updates state, view and storage',
        (assert) => {
          const task = window.App.addTask('Old text');
          window.App.editTask(task.id, 'New text');
          assert.strictEqual(window.App.tasks[0].text, 'New text');
          assert.strictEqual(
            document.querySelector('#todo-list li label').textContent,
            'New text', 'the view shows the new text');
          const stored = JSON.parse(localStorage.getItem('todoapp-tasks'));
          assert.strictEqual(stored.tasks[0].text, 'New text',
            'the storage holds the new text');
        });

      QUnit.test('confirming an empty edit deletes the task',
        (assert) => {
          const task = window.App.addTask('To be emptied');
          window.App.editTask(task.id, '   ');
          assert.strictEqual(window.App.tasks.length, 0,
            'the task is gone from the state');
          assert.strictEqual(
            document.querySelectorAll('#todo-list li').length, 0,
            'the task is gone from the view');
        });

      QUnit.test('Escape cancels the edit and keeps the original text',
        (assert) => {
          const task = window.App.addTask('Original');
          window.App.startEdit(task.id);
          const editInput = document.querySelector('#todo-list input.edit');
          assert.ok(editInput, 'the item is in edit mode');
          editInput.value = 'Changed';
          editInput.dispatchEvent(new KeyboardEvent('keydown',
            { key: 'Escape' }));
          assert.strictEqual(window.App.tasks[0].text, 'Original',
            'the text stays unchanged');
          assert.strictEqual(window.App.editingId, null,
            'edit mode is left');
          assert.ok(document.querySelector('#todo-list li label'),
            'the item renders as a label again');
        });

      QUnit.test('deleting a task removes it from state, view and storage',
        (assert) => {
          const task = window.App.addTask('Delete me');
          window.App.deleteTask(task.id);
          assert.strictEqual(window.App.tasks.length, 0);
          assert.strictEqual(
            document.querySelectorAll('#todo-list li').length, 0);
          assert.deepEqual(
            JSON.parse(localStorage.getItem('todoapp-tasks')).tasks,
            [], 'the storage holds no tasks');
        });

      QUnit.test('toggling, editing and deleting persist across reloads',
        (assert) => {
          const a = window.App.addTask('Keep done');
          window.App.addTask('To edit');
          const c = window.App.addTask('To delete');
          window.App.toggleTask(a.id);
          window.App.editTask(window.App.tasks[1].id, 'Edited');
          window.App.deleteTask(c.id);
          window.App.reset();
          window.App.load();
          assert.strictEqual(window.App.tasks.length, 2,
            'two tasks survive the reload');
          assert.true(window.App.tasks[0].done,
            'the done flag survived');
          assert.strictEqual(window.App.tasks[1].text, 'Edited',
            'the edit survived');
        });
    });

    QUnit.module('filters and clear completed', (hooks) => {
      hooks.beforeEach(() => {
        localStorage.removeItem('todoapp-tasks');
        localStorage.removeItem('todoapp-filter');
        window.App.reset();
        window.App.initialized = false;
        window.App.editingId = null;
        window.App.filter = 'all';
        const fixture = document.getElementById('qunit-fixture');
        fixture.innerHTML =
          `<input id="new-todo" type="text">
          <ul id="todo-list"></ul>
          <span id="todo-count"></span>
          <a id="filter-all" href="#/">Todas</a>
          <a id="filter-active" href="#/active">Pendientes</a>
          <a id="filter-completed" href="#/completed">Completadas</a>
          <button id="clear-completed">Limpiar completadas</button>`;
      });

      const texts = () =>
        [...document.querySelectorAll('#todo-list li label')]
          .map((label) => label.textContent);

      QUnit.test('each filter shows exactly its subset', (assert) => {
        window.App.addTask('Pending one');
        const done = window.App.addTask('Done one');
        window.App.toggleTask(done.id);
        window.App.setFilter('active');
        assert.deepEqual(texts(), ['Pending one'],
          'active shows only pending');
        window.App.setFilter('completed');
        assert.deepEqual(texts(), ['Done one'],
          'completed shows only done');
        window.App.setFilter('all');
        assert.deepEqual(texts(), ['Pending one', 'Done one'],
          'all shows everything');
      });

      QUnit.test('the active filter link carries the selected class',
        (assert) => {
          window.App.render();
          assert.true(
            document.getElementById('filter-all')
              .classList.contains('selected'),
            'all is selected by default');
          window.App.setFilter('completed');
          assert.false(
            document.getElementById('filter-all')
              .classList.contains('selected'));
          assert.true(
            document.getElementById('filter-completed')
              .classList.contains('selected'),
            'completed is marked after switching');
          assert.false(
            document.getElementById('filter-active')
              .classList.contains('selected'));
        });

      QUnit.test('clearing removes all done tasks and keeps the pending',
        (assert) => {
          window.App.addTask('Stay');
          const a = window.App.addTask('Go one');
          const b = window.App.addTask('Go two');
          window.App.toggleTask(a.id);
          window.App.toggleTask(b.id);
          window.App.clearCompleted();
          assert.strictEqual(window.App.tasks.length, 1);
          assert.strictEqual(window.App.tasks[0].text, 'Stay');
          assert.deepEqual(texts(), ['Stay'],
            'the view keeps only the pending task');
          assert.deepEqual(
            JSON.parse(localStorage.getItem('todoapp-tasks')).tasks,
            [{ id: 1, text: 'Stay', done: false, listId: 'inbox' }],
            'the storage keeps only the pending task');
          window.App.reset();
          window.App.load();
          assert.strictEqual(window.App.tasks.length, 1,
            'a reload keeps the cleared result');
          assert.strictEqual(window.App.tasks[0].text, 'Stay');
        });

      QUnit.test('operations keep working under an active filter',
        (assert) => {
          window.App.setFilter('active');
          const t = window.App.addTask('Visible while pending');
          assert.deepEqual(texts(), ['Visible while pending']);
          window.App.editTask(t.id, 'Renamed');
          assert.deepEqual(texts(), ['Renamed'],
            'editing works under the filter');
          window.App.toggleTask(t.id);
          assert.deepEqual(texts(), [],
            'a toggled task leaves the active view');
          assert.strictEqual(window.App.tasks.length, 1,
            'the task still exists in the state');
          window.App.deleteTask(t.id);
          assert.strictEqual(window.App.tasks.length, 0,
            'deleting works under the filter');
        });

      QUnit.test('the counter totals pending, not visible tasks',
        (assert) => {
          window.App.addTask('Pending');
          const d = window.App.addTask('Done');
          window.App.toggleTask(d.id);
          window.App.setFilter('completed');
          assert.strictEqual(
            document.getElementById('todo-count').textContent,
            '1 pendiente',
            'the counter counts all pending, not the visible ones');
        });

      QUnit.test('the filter persists and tolerates corrupted values',
        (assert) => {
          window.App.setFilter('completed');
          assert.strictEqual(localStorage.getItem('todoapp-filter'),
            'completed', 'the filter is stored');
          window.App.filter = 'all';
          window.App.load();
          assert.strictEqual(window.App.filter, 'completed',
            'load restores the stored filter');
          localStorage.setItem('todoapp-filter', 'nonsense');
          window.App.load();
          assert.strictEqual(window.App.filter, 'all',
            'a corrupted value falls back to all');
        });
    });

    QUnit.module('lists and migration', (hooks) => {
      hooks.beforeEach(() => {
        localStorage.removeItem('todoapp-tasks');
        localStorage.removeItem('todoapp-filter');
        window.App.reset();
        window.App.initialized = false;
        window.App.editingId = null;
        window.App.filter = 'all';
        const fixture = document.getElementById('qunit-fixture');
        fixture.innerHTML =
          `<input id="new-todo" type="text">
          <ul id="todo-list"></ul>
          <span id="todo-count"></span>`;
      });

      QUnit.test('an empty app always holds the permanent inbox list',
        (assert) => {
          assert.deepEqual(window.App.lists,
            [{ id: 'inbox', name: 'Entrada' }],
            'the inbox exists with its name');
          window.App.load();
          assert.deepEqual(window.App.lists,
            [{ id: 'inbox', name: 'Entrada' }],
            'loading empty storage keeps the inbox');
        });

      QUnit.test('created tasks belong to the inbox list',
        (assert) => {
          const task = window.App.addTask('In inbox');
          assert.strictEqual(task.listId, 'inbox',
            'the new task carries the inbox id');
          assert.strictEqual(window.App.tasks[0].listId, 'inbox');
        });

      QUnit.test('legacy flat-array data migrates into the inbox',
        (assert) => {
          localStorage.setItem('todoapp-tasks', JSON.stringify([
            { id: 1, text: 'Old one', done: false },
            { id: 2, text: 'Old two', done: true }
          ]));
          window.App.load();
          assert.strictEqual(window.App.tasks.length, 2,
            'both tasks survive');
          assert.true(
            window.App.tasks.every((t) => t.listId === 'inbox'),
            'every migrated task lands in the inbox');
          window.App.addTask('Trigger save');
          const stored = JSON.parse(localStorage.getItem('todoapp-tasks'));
          assert.ok(Array.isArray(stored.lists) &&
            Array.isArray(stored.tasks),
            'saving writes the new {lists, tasks} format');
        });

      QUnit.test('the new format restores lists and membership',
        (assert) => {
          localStorage.setItem('todoapp-tasks', JSON.stringify({
            lists: [
              { id: 'inbox', name: 'Entrada' },
              { id: 'work', name: 'Trabajo' }
            ],
            tasks: [
              { id: 1, text: 'In work', done: false, listId: 'work' },
              { id: 2, text: 'In inbox', done: false, listId: 'inbox' }
            ]
          }));
          window.App.load();
          assert.deepEqual(
            window.App.lists.map((l) => l.id), ['inbox', 'work'],
            'both lists come back');
          assert.strictEqual(window.App.tasks[0].listId, 'work',
            'the task keeps its list');
        });

      QUnit.test('tasks pointing to a missing list do not load',
        (assert) => {
          localStorage.setItem('todoapp-tasks', JSON.stringify({
            lists: [{ id: 'inbox', name: 'Entrada' }],
            tasks: [
              { id: 1, text: 'Orphan', done: false, listId: 'ghost' },
              { id: 2, text: 'Fine', done: false, listId: 'inbox' }
            ]
          }));
          window.App.load();
          assert.deepEqual(
            window.App.tasks.map((t) => t.id), [2],
            'only the task with an existing list enters the state');
        });

      QUnit.test('duplicate list ids in storage collapse to one',
        (assert) => {
          localStorage.setItem('todoapp-tasks', JSON.stringify({
            lists: [
              { id: 'work', name: 'Trabajo' },
              { id: 'work', name: 'Duplicada' }
            ],
            tasks: []
          }));
          window.App.load();
          assert.deepEqual(
            window.App.lists.map((l) => l.id), ['inbox', 'work'],
            'the duplicated id loads once');
        });

      QUnit.test('loading data without the inbox recreates it',
        (assert) => {
          localStorage.setItem('todoapp-tasks', JSON.stringify({
            lists: [{ id: 'work', name: 'Trabajo' }],
            tasks: []
          }));
          window.App.load();
          assert.true(
            window.App.lists.some((l) => l.id === 'inbox'),
            'the inbox is back');
          assert.true(
            window.App.lists.some((l) => l.id === 'work'),
            'the stored list survives too');
        });

      QUnit.test('corrupted data yields empty state with the inbox',
        (assert) => {
          localStorage.setItem('todoapp-tasks', '{broken json');
          window.App.load();
          assert.deepEqual(window.App.tasks, []);
          assert.deepEqual(window.App.lists,
            [{ id: 'inbox', name: 'Entrada' }],
            'the inbox still exists');
          localStorage.setItem('todoapp-tasks', '"a string"');
          window.App.load();
          assert.deepEqual(window.App.tasks, [],
            'a non-object payload is tolerated too');
        });
    });

    QUnit.module('active list navigation', (hooks) => {
      hooks.beforeEach(() => {
        localStorage.removeItem('todoapp-tasks');
        localStorage.removeItem('todoapp-filter');
        localStorage.removeItem('todoapp-active-list');
        window.App.reset();
        window.App.initialized = false;
        window.App.editingId = null;
        window.App.filter = 'all';
        const fixture = document.getElementById('qunit-fixture');
        fixture.innerHTML =
          `<input id="new-todo" type="text">
          <select id="list-select"></select>
          <ul id="todo-list"></ul>
          <span id="todo-count"></span>
          <a id="filter-all" href="#/">Todas</a>
          <a id="filter-active" href="#/active">Pendientes</a>
          <a id="filter-completed" href="#/completed">Completadas</a>
          <button id="clear-completed">Limpiar completadas</button>`;
      });

      const texts = () =>
        [...document.querySelectorAll('#todo-list li label')]
          .map((label) => label.textContent);

      const seedTwoLists = () => {
        localStorage.setItem('todoapp-tasks', JSON.stringify({
          lists: [
            { id: 'inbox', name: 'Entrada' },
            { id: 'work', name: 'Trabajo' }
          ],
          tasks: [
            { id: 1, text: 'Inbox one', done: false, listId: 'inbox' },
            { id: 2, text: 'Inbox done', done: true, listId: 'inbox' },
            { id: 3, text: 'Work one', done: false, listId: 'work' },
            { id: 4, text: 'Work two', done: false, listId: 'work' },
            { id: 5, text: 'Work done', done: true, listId: 'work' }
          ]
        }));
        window.App.load();
        window.App.render();
      };

      QUnit.test('switching lists shows exactly its tasks', (assert) => {
        seedTwoLists();
        assert.deepEqual(texts(), ['Inbox one', 'Inbox done'],
          'the inbox is active by default');
        window.App.setActiveList('work');
        assert.deepEqual(texts(), ['Work one', 'Work two', 'Work done'],
          'the view shows only the tasks of the chosen list');
        window.App.setActiveList('inbox');
        assert.deepEqual(texts(), ['Inbox one', 'Inbox done'],
          'switching back restores the inbox view');
      });

      QUnit.test('the counter counts only the active list',
        (assert) => {
          seedTwoLists();
          assert.strictEqual(
            document.getElementById('todo-count').textContent,
            '1 pendiente', 'the inbox has one pending task');
          window.App.setActiveList('work');
          assert.strictEqual(
            document.getElementById('todo-count').textContent,
            '2 pendientes', 'the counter is scoped to work');
        });

      QUnit.test('filters operate within the active list', (assert) => {
        seedTwoLists();
        window.App.setActiveList('work');
        window.App.setFilter('completed');
        assert.deepEqual(texts(), ['Work done'],
          'completed shows only work done tasks');
        window.App.setFilter('active');
        assert.deepEqual(texts(), ['Work one', 'Work two'],
          'active shows only work pending tasks');
        window.App.setFilter('all');
        assert.deepEqual(texts(),
          ['Work one', 'Work two', 'Work done']);
      });

      QUnit.test('new tasks land in the active list', (assert) => {
        seedTwoLists();
        const inboxTask = window.App.addTask('For inbox');
        assert.strictEqual(inboxTask.listId, 'inbox');
        window.App.setActiveList('work');
        const workTask = window.App.addTask('For work');
        assert.strictEqual(workTask.listId, 'work',
          'the task is captured by the active list');
        assert.deepEqual(
          JSON.parse(localStorage.getItem('todoapp-tasks'))
            .tasks.map((t) => t.listId).filter((id) => id === 'work')
            .length,
          4, 'storage reflects the membership');
      });

      QUnit.test('the selector lists all lists and marks the active',
        (assert) => {
          seedTwoLists();
          const select = document.getElementById('list-select');
          const options = [...select.options];
          assert.strictEqual(options.length, 2, 'one option per list');
          assert.strictEqual(options[0].textContent, 'Entrada (1)');
          assert.strictEqual(options[1].textContent, 'Trabajo (2)',
            'each option carries its pending count');
          assert.strictEqual(select.value, 'inbox',
            'the active list is selected');
          window.App.setActiveList('work');
          assert.strictEqual(select.value, 'work');
          window.App.toggleTask(
            window.App.tasks.find((t) => t.listId === 'work').id);
          assert.strictEqual(
            document.getElementById('list-select').options[1]
              .textContent,
            'Trabajo (1)', 'the counter follows model changes');
        });

      QUnit.test('changing the selector switches the active list',
        (assert) => {
          seedTwoLists();
          window.App.init();
          const select = document.getElementById('list-select');
          select.value = 'work';
          select.dispatchEvent(new Event('change'));
          assert.strictEqual(window.App.activeListId, 'work',
            'the change event reaches the facade');
          assert.deepEqual(texts(),
            ['Work one', 'Work two', 'Work done']);
        });

      QUnit.test('the active list persists across reloads',
        (assert) => {
          seedTwoLists();
          window.App.setActiveList('work');
          assert.strictEqual(
            localStorage.getItem('todoapp-active-list'), 'work',
            'the choice is stored');
          window.App.reset();
          window.App.load();
          assert.strictEqual(window.App.activeListId, 'work',
            'load restores the stored list');
          window.App.render();
          assert.deepEqual(texts(),
            ['Work one', 'Work two', 'Work done'],
            'the restored view is scoped to work');
        });

      QUnit.test('a missing or stale stored list falls back to inbox',
        (assert) => {
          seedTwoLists();
          assert.strictEqual(window.App.activeListId, 'inbox',
            'no stored value means the inbox');
          localStorage.setItem('todoapp-active-list', 'ghost');
          window.App.load();
          assert.strictEqual(window.App.activeListId, 'inbox',
            'a list that does not exist falls back to the inbox');
        });

      QUnit.test('switching lists cancels the edit in progress',
        (assert) => {
          seedTwoLists();
          window.App.startEdit(window.App.tasks[0].id);
          assert.strictEqual(window.App.editingId, 1);
          window.App.setActiveList('work');
          assert.strictEqual(window.App.editingId, null,
            'the edit mode is left when the list changes');
        });

      QUnit.test('clear completed empties only the active list',
        (assert) => {
          seedTwoLists();
          window.App.setActiveList('work');
          window.App.clearCompleted();
          assert.deepEqual(
            window.App.tasks
              .filter((t) => t.listId === 'work')
              .map((t) => t.id),
            [3, 4], 'work keeps only its pending tasks');
          assert.true(
            window.App.tasks.some((t) => t.id === 2),
            'the done task of the inbox survives');
        });
    });
  </script>
</body>
